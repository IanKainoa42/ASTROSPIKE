name: ASTROSPIKE
options:
  bundleIdPrefix: com.iankainoa
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "26.6"
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "9"
    DEVELOPMENT_TEAM: WC46K49VFA
    CODE_SIGN_STYLE: Automatic
targets:
  ASTROSPIKECore:
    type: framework
    platform: iOS
    sources:
      - ASTROSPIKECore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iankainoa.ASTROSPIKE.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES
        DEFINES_MODULE: YES
  ASTROSPIKE:
    type: application
    platform: iOS
    sources:
      - ASTROSPIKE
    dependencies:
      - target: ASTROSPIKECore
    entitlements:
      path: ASTROSPIKE/ASTROSPIKE.entitlements
      properties:
        com.apple.developer.game-center: true
    info:
      path: ASTROSPIKE/Info.plist
      properties:
        CFBundleDisplayName: ASTROSPIKE
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iankainoa.ASTROSPIKE
        PRODUCT_NAME: ASTROSPIKE
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_USER_SCRIPT_SANDBOXING: YES
    scheme:
      testTargets:
        - ASTROSPIKECoreTests
        - ASTROSPIKEUITests
      gatherCoverageData: true
  ASTROSPIKECoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - ASTROSPIKECoreTests
    dependencies:
      - target: ASTROSPIKECore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iankainoa.ASTROSPIKE.core-tests
        GENERATE_INFOPLIST_FILE: YES
  ASTROSPIKEUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - ASTROSPIKEUITests
    dependencies:
      - target: ASTROSPIKE
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.iankainoa.ASTROSPIKE.ui-tests
        GENERATE_INFOPLIST_FILE: YES
