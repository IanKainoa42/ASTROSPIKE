name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ${{ vars.CI_RUNNER || 'self-hosted' }}
    timeout-minutes: 60

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Show the toolchain
        env:
          XCODE_APP: ${{ vars.XCODE_APP }}
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app || true
          if [ -n "${XCODE_APP:-}" ]; then
            sudo xcode-select --switch "${XCODE_APP}/Contents/Developer"
          fi
          xcodebuild -version
          swift --version
          xcodebuild -showsdks | grep -i iphonesimulator

      - name: Install XcodeGen
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: command -v xcodegen >/dev/null 2>&1 || brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Resolve an iOS simulator
        id: simulator
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available --json | jq -r '
            [ .devices
              | to_entries[]
              | select(.key | contains("SimRuntime.iOS"))
              | .key as $runtime
              | .value[]
              | select(.isAvailable and (.name | startswith("iPhone")))
              | { runtime: $runtime, name: .name, udid: .udid }
            ]
            | sort_by(.runtime, .name)
            | last
            | .udid // empty')"
          if [ -z "$udid" ]; then
            echo "::error::No available iPhone simulator on this runner."
            xcrun simctl list devices
            exit 1
          fi
          xcrun simctl list devices available | grep -F "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b

      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project ASTROSPIKE.xcodeproj \
            -scheme ASTROSPIKE \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults/build.xcresult \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="" \
            DEVELOPMENT_TEAM=""

      - name: Unit tests
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project ASTROSPIKE.xcodeproj \
            -scheme ASTROSPIKE \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults/unit.xcresult \
            -only-testing:ASTROSPIKECoreTests

      - name: UI tests
        if: vars.SKIP_UI_TESTS != 'true'
        run: |
          set -euo pipefail
          xcodebuild test-without-building \
            -project ASTROSPIKE.xcodeproj \
            -scheme ASTROSPIKE \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath DerivedData \
            -resultBundlePath TestResults/ui.xcresult \
            -only-testing:ASTROSPIKEUITests

      - name: Upload result bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcresults
          path: TestResults
          retention-days: 7
          if-no-files-found: ignore

      - name: Clear result bundles
        if: always()
        run: rm -rf TestResults
